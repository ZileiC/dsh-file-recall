name: pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'README.md'
      - 'docs/**'
      - 'scripts/agent-guide.mjs'
      - 'scripts/site-postbuild.mjs'
      - 'scripts/site-manifest.mjs'
      - 'scripts/check-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The agent guide is generated from docs/INSTALL-FOR-AGENTS.md so the
      # Markdown and the web page can never drift apart. Same script locally.
      - name: Render the agent guide
        run: node scripts/agent-guide.mjs

      - uses: actions/configure-pages@v5

      # Nothing is published unless scripts/site-manifest.mjs names it. Copying
      # docs/ wholesale once published an internal acceptance note; that is why
      # this step assembles from a list instead.
      - name: Assemble the site from the manifest
        run: node scripts/site-postbuild.mjs _site

      - name: Check every local link resolves
        run: node scripts/check-site.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
