name: pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'README.md'
      - 'docs/**'
      - 'scripts/agent-guide.mjs'
      - 'scripts/site-postbuild.mjs'
      - 'scripts/check-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The agent guide is generated from docs/INSTALL-FOR-AGENTS.md so the
      # Markdown and the web page can never drift apart. Same script locally.
      - name: Render the agent guide
        run: node scripts/agent-guide.mjs

      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html icon.svg _site/
          cp -r docs _site/docs
          ls -R _site | head -40

      # Turns the .md files into pages, and fails the deploy when a README badge
      # no longer renders (a 200 with an error picture counts as broken).
      - name: Markdown pages and badge check
        run: node scripts/site-postbuild.mjs _site

      - name: Check every local link resolves
        run: node scripts/check-site.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
