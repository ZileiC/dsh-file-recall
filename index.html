<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-file-recall · 本地文件检索插件</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #f7f6f3;
    --ink: #1f2430;
    --ink-2: #5a6172;
    --rule: #dedbd4;
    --accent: #4d6bfe;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16181d; --ink: #e8e9ec; --ink-2: #a4a9b6; --rule: #2e323b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 560px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand img { width: 28px; height: 28px; }
  .brand span { font-size: 13px; letter-spacing: .04em; color: var(--ink-2); }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.35; }
  .lede { margin: 0 0 30px; color: var(--ink-2); }

  /* 选系统：两个等大的按钮，一眼就是二选一 */
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 34px; }
  @media (max-width: 480px) { .pick { grid-template-columns: 1fr; } }
  .pick a {
    display: block; padding: 22px 20px 20px; border-radius: 14px;
    border: 1px solid var(--rule); background: var(--ink); color: var(--paper);
    text-decoration: none; transition: transform 120ms ease-out, box-shadow 120ms ease-out;
  }
  .pick a:hover, .pick a:focus-visible {
    transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.18);
  }
  .pick a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .pick .os { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .pick .sub { display: block; margin-top: 6px; font-size: 13px; opacity: .72; }
  .pick .go { display: block; margin-top: 16px; font-size: 13px; color: var(--on-accent); opacity: .85; }

  .others { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .others li { border-bottom: 1px solid var(--rule); }
  .others a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 13px 2px; color: var(--ink); text-decoration: none;
  }
  .others a:hover .tag, .others a:focus-visible .tag { color: var(--accent); }
  .others strong { font-weight: 500; }
  .tag { color: var(--ink-2); font-size: 13px; white-space: nowrap; }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise .32s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="icon.svg" alt="">
    <span>DeepSeek Harness 插件</span>
  </div>

  <h1>dsh-file-recall</h1>
  <p class="lede">在本机资料里按模糊描述找到文件和页，并给出可核验的原文片段。</p>

  <div class="pick">
    <a href="./docs/install-universal.html">
      <span class="os">macOS</span>
      <span class="sub">七步安装指引</span>
      <span class="go">打开</span>
    </a>
    <a href="./docs/install-windows.html">
      <span class="os">Windows</span>
      <span class="sub">七步安装指引</span>
      <span class="go">打开</span>
    </a>
  </div>

  <ul class="others">
    <li><a href="./docs/install-universal-standalone.html"><strong>macOS 单文件版</strong><span class="tag">离线可看</span></a></li>
    <li><a href="./docs/install-windows-standalone.html"><strong>Windows 单文件版</strong><span class="tag">离线可看</span></a></li>
    <li><a href="./docs/INSTALL-FOR-AGENTS.html"><strong>给 agent 的安装教程</strong><span class="tag">命令行路径</span></a></li>
    <li><a href="https://github.com/ZileiC/dsh-file-recall/releases/latest"><strong>下载离线安装包</strong><span class="tag">GitHub Release</span></a></li>
  </ul>
</main>
</body>
</html>
